workflows:
  ios-unsigned:
    name: 3106 - iOS IPA (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS app
        script: |
          set -euo pipefail
          xcodebuild -project ThreeOneOSSix.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/3106.app"
          if [ ! -d "$APP" ]; then
            echo "Expected app not found: $APP"
            find "$CM_BUILD_DIR/build/Build/Products" -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/ipa/Payload" 
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry 3106-unsigned.ipa Payload
    artifacts:
      - ipa/*.ipa
      - build/Build/Products/Release-iphoneos/*.app
